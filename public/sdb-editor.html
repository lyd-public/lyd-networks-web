<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDB Editor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.header { background: #16213e; border-bottom: 1px solid #0f3460; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; flex-wrap: wrap; }
.header h1 { font-size: 16px; font-weight: 600; color: #e94560; letter-spacing: 1px; }
.header .ver { font-size: 10px; color: #1abc9c; border: 1px solid #1abc9c55; border-radius: 3px; padding: 1px 6px; }
.header-info { font-size: 12px; color: #888; margin-left: auto; }
.sel { background: #0f3460; border: 1px solid #1a5276; color: #e0e0e0; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; }
.toolbar { background: #16213e; border-bottom: 1px solid #0f3460; padding: 8px 16px; display: flex; gap: 8px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
.btn { padding: 6px 14px; border-radius: 4px; border: none; font-size: 12px; cursor: pointer; font-weight: 500; transition: all 0.15s; }
.btn-primary { background: #e94560; color: #fff; } .btn-primary:hover { background: #c73650; }
.btn-secondary { background: #0f3460; color: #e0e0e0; border: 1px solid #1a5276; } .btn-secondary:hover { background: #1a5276; }
.btn-success { background: #1abc9c; color: #fff; } .btn-success:hover { background: #17a589; }
.btn-danger { background: #c0392b; color: #fff; } .btn-danger:hover { background: #a93226; }
.btn-warn { background: #e67e22; color: #fff; } .btn-warn:hover { background: #ca6f1e; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.search-input { background: #0f3460; border: 1px solid #1a5276; color: #e0e0e0; padding: 6px 10px; border-radius: 4px; font-size: 12px; width: 180px; }
.search-input:focus { outline: none; border-color: #e94560; }
.toolbar-sep { width: 1px; height: 24px; background: #0f3460; margin: 0 4px; }
.main { display: flex; flex: 1; overflow: hidden; }
.table-panel { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.table-wrap { flex: 1; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { position: sticky; top: 0; z-index: 10; }
thead th { background: #0f3460; color: #a0c4ff; font-weight: 500; padding: 8px 10px; text-align: left; border-bottom: 1px solid #1a5276; white-space: nowrap; }
tbody tr { border-bottom: 1px solid #1a2744; cursor: pointer; transition: background 0.1s; }
tbody tr:hover { background: #1a2744; }
tbody tr.selected { background: #0f3460 !important; border-left: 3px solid #e94560; }
tbody tr.modified { background: #0a2010 !important; }
tbody tr.modified.selected { background: #0f3a20 !important; }
tbody tr.deleted { background: #2a0a0a !important; opacity: 0.5; }
tbody tr.deleted.selected { background: #3a0f0f !important; opacity: 0.7; }
tbody tr.blanked { background: #1a1a0a !important; }
tbody tr.blanked.selected { background: #2a2a0f !important; }
td { padding: 6px 10px; vertical-align: top; }
td.id-col { color: #888; font-size: 11px; width: 54px; white-space: nowrap; }
td.trk-col { color: #888; font-size: 11px; width: 28px; text-align: center; }
td.trk-col.b { color: #f7c948; }
td.tc-col { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; color: #a0c4ff; white-space: nowrap; width: 96px; }
td.text-col { color: #e0e0e0; max-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.text-col.ital { font-style: italic; }
td.dur-col { color: #888; font-size: 11px; width: 52px; text-align: right; }
td.chk-col { width: 30px; text-align: center; padding: 4px; }
td.chk-col input { cursor: pointer; accent-color: #e94560; width: 14px; height: 14px; }
tbody tr.multi-sel { background: #1a2a40 !important; border-left: 3px solid #1abc9c; }
tbody tr.multi-sel.selected { background: #0f3a50 !important; }
tbody tr.multi-sel.deleted { background: #2a0a1a !important; }
.del-badge, .blank-badge, .fmt-badge { display: inline-block; color: #fff; font-size: 9px; padding: 1px 4px; border-radius: 2px; margin-right: 3px; vertical-align: middle; font-style: normal; }
.del-badge { background: #c0392b; } .blank-badge { background: #e67e22; }
.fmt-badge { background: #34495e; color: #cfd8dc; }
ruby rt { font-size: 0.55em; color: #f7c948; font-style: normal; }
td.text-col ruby rt { font-size: 9px; }
.preview { background: #000; border: 1px solid #1a2744; border-radius: 4px; padding: 14px 10px; margin-bottom: 14px; min-height: 90px; display: flex; align-items: center; justify-content: center; overflow: auto; }
.preview .pv { color: #fff; font-family: 'FA 丸ゴシックTV-b', 'ＦＡ 丸ゴシックＴＶ―ｂ', 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Yu Gothic UI', 'Meiryo', sans-serif; font-size: 20px; line-height: 1.9; text-align: center; white-space: pre-wrap;
  text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 0 0 3px #000; }
.preview .pv.ital { transform: skewX(-12deg); }
.preview .pv.vert { writing-mode: vertical-rl; text-align: start; max-height: 260px; }
.preview .pv.vert.ital { transform: skewY(12deg); }
.preview .pv ruby rt { color: #fff; font-size: 0.48em; }
.ruby-list { font-size: 12px; color: #cfd8dc; margin: -6px 0 12px; line-height: 1.7; }
.ruby-list .stale { color: #e67e22; }
.kv { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.kv td { padding: 5px 8px; border-bottom: 1px solid #1a2744; vertical-align: top; }
.kv td:first-child { color: #888; white-space: nowrap; width: 38%; }
.kv tr.sec td { color: #a0c4ff; font-weight: 600; padding-top: 12px; border-bottom: 1px solid #1a5276; }
.swatch { display: inline-block; width: 12px; height: 12px; border: 1px solid #555; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
.font-chip { cursor: pointer; } .font-chip:hover strong { color: #e94560; }
.vert-badge { display: inline-block; font-size: 9px; padding: 1px 4px; border-radius: 2px; margin-right: 3px; vertical-align: middle; background: #6c3483; color: #fff; font-style: normal; }
.pos-badge { display: inline-block; font-size: 9px; padding: 1px 4px; border-radius: 2px; margin-right: 3px; vertical-align: middle; background: #1f618d; color: #fff; font-style: normal; }
.mod-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #1abc9c; margin-right: 4px; vertical-align: middle; }
.edit-panel { width: 360px; background: #16213e; border-left: 1px solid #0f3460; display: flex; flex-direction: column; flex-shrink: 0; }
.edit-panel-header { padding: 12px 16px; border-bottom: 1px solid #0f3460; font-size: 13px; font-weight: 600; color: #a0c4ff; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.edit-body { padding: 14px 16px; flex: 1; overflow-y: auto; }
.field-group { margin-bottom: 14px; }
.field-label { font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
.field-input { width: 100%; background: #0f3460; border: 1px solid #1a5276; color: #e0e0e0; padding: 7px 10px; border-radius: 4px; font-size: 13px; font-family: 'Consolas', 'Courier New', monospace; }
.field-input:focus { outline: none; border-color: #e94560; }
textarea.field-input { resize: vertical; min-height: 100px; font-family: 'Segoe UI', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif; line-height: 1.5; font-size: 14px; }
textarea.field-input.ital { font-style: italic; }
.tc-hint { font-size: 11px; color: #1abc9c; margin-top: 4px; font-family: monospace; }
.tc-hint.err { color: #e94560; }
.edit-actions { padding: 12px 16px; border-top: 1px solid #0f3460; display: flex; gap: 6px; flex-wrap: wrap; }
.edit-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 200px; color: #555; font-size: 13px; gap: 8px; }
.drop-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #555; cursor: pointer; transition: background 0.2s; }
.drop-zone.drag-over { background: #1a2a3a; }
.drop-icon { font-size: 64px; opacity: 0.3; }
.drop-zone h2 { font-size: 20px; color: #888; font-weight: 400; }
.drop-zone p { font-size: 13px; color: #555; }
.drop-btn { background: #0f3460; border: 1px dashed #1a5276; color: #a0c4ff; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; display: inline-block; }
.drop-btn:hover { border-color: #e94560; color: #e94560; }
.stats-bar { background: #0f1b2d; border-top: 1px solid #0f3460; padding: 4px 16px; display: flex; gap: 20px; font-size: 11px; color: #555; flex-shrink: 0; flex-wrap: wrap; }
.stats-bar strong { color: #a0c4ff; }
.notif { position: fixed; top: 110px; right: 20px; background: #1abc9c; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; z-index: 999; animation: fadeIn 0.2s; max-width: 420px; }
.notif.err { background: #e94560; } .notif.warn { background: #e67e22; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.hint { font-size: 11px; color: #666; margin-top: 3px; }
.mod-badge { background: #1abc9c22; color: #1abc9c; font-size: 10px; padding: 1px 6px; border-radius: 3px; }
.info-box { font-size: 11px; color: #9aa; background: #0f1b2d; border: 1px solid #1a2744; border-radius: 4px; padding: 8px 10px; margin-bottom: 12px; line-height: 1.6; }
.info-box b { color: #a0c4ff; font-weight: 500; }
.del-status { font-size: 12px; color: #e94560; background: #2a0a0a; border: 1px solid #c0392b; border-radius: 4px; padding: 8px 10px; margin-bottom: 8px; }
.blank-status { font-size: 12px; color: #e67e22; background: #2a1500; border: 1px solid #e67e22; border-radius: 4px; padding: 8px 10px; margin-bottom: 8px; }
.modal-bg { position: fixed; inset: 0; background: #0009; z-index: 1000; display: flex; align-items: center; justify-content: center; }
.modal { background: #16213e; border: 1px solid #1a5276; border-radius: 8px; width: min(560px, 92vw); max-height: 80vh; display: flex; flex-direction: column; }
.modal h3 { font-size: 14px; padding: 14px 18px; border-bottom: 1px solid #0f3460; color: #a0c4ff; font-weight: 600; }
.modal .mbody { padding: 14px 18px; overflow: auto; font-size: 12.5px; line-height: 1.7; }
.modal .mbody li { margin-left: 18px; }
.modal .mbody .ok { color: #1abc9c; } .modal .mbody .bad { color: #e94560; } .modal .mbody .warnc { color: #e67e22; }
.modal .mfoot { padding: 12px 18px; border-top: 1px solid #0f3460; display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>

<div class="header">
  <h1>⬡ SDB EDITOR</h1><span class="ver">v2 · Jet 구조 기반 저장</span>
  <span class="header-info" id="file-info">파일을 열어주세요</span>
  <select class="sel" id="fps-select" title="SRT 내보내기용 실제 프레임레이트">
    <option value="23.976">23.976 fps</option>
    <option value="24">24 fps</option>
    <option value="29.97">29.97 fps</option>
    <option value="30">30 fps</option>
  </select>
  <select class="sel" id="tc-mode" title="타임코드 표기 방식">
    <option value="canvas">TC: CANVAS 표기 (In +1 / Out +2)</option>
    <option value="raw">TC: 저장 프레임 그대로</option>
  </select>
  <button class="btn btn-secondary" id="btn-globals" disabled title="Globals 테이블의 폰트·서식 설정">🅵 폰트·서식 설정</button>
</div>

<div class="toolbar">
  <button class="btn btn-primary" id="btn-open">📂 파일 열기</button>
  <input type="file" id="file-input" accept=".sdb" style="display:none">
  <div class="toolbar-sep"></div>
  <button class="btn btn-success" id="btn-save" disabled>💾 SDB 저장</button>
  <button class="btn btn-secondary" id="btn-export-srt" disabled>📄 SRT 내보내기</button>
  <div class="toolbar-sep"></div>
  <button class="btn btn-secondary" id="btn-prev" disabled>◀ 이전</button>
  <button class="btn btn-secondary" id="btn-next" disabled>▶ 다음</button>
  <div class="toolbar-sep"></div>
  <button class="btn btn-danger" id="btn-del-selected" disabled title="체크한 항목 삭제">🗑 선택 삭제</button>
  <button class="btn btn-warn" id="btn-keep-selected" disabled title="체크한 항목만 남기고 나머지 삭제">✅ 선택만 유지</button>
  <button class="btn btn-secondary" id="btn-sel-all" disabled>전체선택</button>
  <button class="btn btn-secondary" id="btn-sel-none" disabled>선택해제</button>
  <button class="btn btn-secondary" id="btn-restore-all" disabled title="수정/삭제/비움 모두 취소">↩ 전체복원</button>
  <div class="toolbar-sep"></div>
  <input type="text" class="search-input" id="search-input" placeholder="자막 · TC · 번호 검색" disabled>
  <select class="sel" id="view-filter" disabled><option value="all">전체</option><option value="vert">縦書き만</option><option value="ital">斜体만</option><option value="fmt">서식 있는 행만</option><option value="B">트랙 B만</option></select>
  <span style="font-size:12px;color:#1abc9c;margin-left:4px" id="mod-label"></span>
</div>

<div class="main" id="main">
  <div class="drop-zone" id="drop-zone">
    <div class="drop-icon">🎬</div>
    <h2>SDB 파일을 드래그하거나 선택하세요</h2>
    <p>자막 편집 · 항목 삭제 · SDB / SRT 저장</p>
    <label class="drop-btn" for="file-input">📂 파일 선택</label>
  </div>
</div>

<div class="stats-bar" id="stats-bar" style="display:none">
  <div>총: <strong id="stat-total">0</strong></div>
  <div>수정: <strong id="stat-mod">0</strong></div>
  <div>비움: <strong id="stat-blank">0</strong></div>
  <div>삭제: <strong id="stat-del">0</strong></div>
  <div>선택: <strong id="stat-sel">-</strong></div>
  <div>이탤릭: <strong id="stat-ital">0</strong></div>
  <div>세로: <strong id="stat-vert">0</strong></div>
  <div>루비: <strong id="stat-ruby">0</strong></div>
  <div class="font-chip" id="font-chip" title="클릭하면 전체 설정 보기">폰트: <strong id="stat-font">-</strong></div>
  <div>파일: <strong id="stat-size">-</strong></div>
</div>

<script>
// sdbcore.js — CANVAS SDB (Microsoft Jet4 / Access 2000 format) reader & writer
// SDB = Jet4 database whose 16-byte signature at 0x04 is "CANVASs SST FMT\0"
// instead of "Standard Jet DB\0". Everything else is plain Jet4.
// Edits respect Jet page structure: row offset tables, free space, variable
// column offset tables, table row counts and index B-trees.
(function (root) {
'use strict';
const PS = 4096;
const DELETED = 0x8000, OVERFLOW = 0x4000, OFFMASK = 0x1FFF;
const IDX_MASK_OFF = 27, IDX_MASK_LEN = 453, IDX_ENTRY_OFF = 480;
const MAX_ROW = 4060;

class SDBError extends Error {}

function lcp(a, b) { let n = 0; const m = Math.min(a.length, b.length); while (n < m && a[n] === b[n]) n++; return n; }
function concat(arrs) { let n = 0; for (const a of arrs) n += a.length; const o = new Uint8Array(n); let p = 0; for (const a of arrs) { o.set(a, p); p += a.length; } return o; }
function eqBytes(a, b) { if (a.length !== b.length) return false; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }

// ── text codec (Jet4 "unicode compression") ───────────────────────────────────
function decodeText(raw) {
  if (raw.length >= 2 && raw[0] === 0xFF && raw[1] === 0xFE) {
    let s = '', comp = true, i = 2;
    while (i < raw.length) {
      if (raw[i] === 0) { comp = !comp; i++; }
      else if (comp) { s += String.fromCharCode(raw[i]); i++; }
      else if (i + 1 < raw.length) { s += String.fromCharCode(raw[i] | raw[i + 1] << 8); i += 2; }
      else break;
    }
    return s;
  }
  let s = '';
  for (let i = 0; i + 1 < raw.length; i += 2) s += String.fromCharCode(raw[i] | raw[i + 1] << 8);
  return s;
}
function encodeText(str, allowCompress) {
  // Same rule as Jackcess: compress only when >2 chars and every char is 0x01..0xFF
  if (allowCompress && str.length > 2 && [...str].every(c => { const v = c.charCodeAt(0); return v >= 1 && v <= 0xFF; })) {
    const o = new Uint8Array(str.length + 2); o[0] = 0xFF; o[1] = 0xFE;
    for (let i = 0; i < str.length; i++) o[i + 2] = str.charCodeAt(i);
    return o;
  }
  const o = new Uint8Array(str.length * 2);
  for (let i = 0; i < str.length; i++) { const v = str.charCodeAt(i); o[2 * i] = v & 0xFF; o[2 * i + 1] = v >> 8; }
  return o;
}

class SDB {
  constructor(buf) {
    this.d = new Uint8Array(buf.slice ? buf.slice(0) : buf);
    if (this.d.length < PS * 3 || this.d.length % PS) throw new SDBError('파일 크기가 4096바이트 페이지 단위가 아닙니다 (손상 가능).');
    const sig = String.fromCharCode(...this.d.slice(4, 19));
    if (sig !== 'CANVASs SST FMT' && sig !== 'Standard Jet DB') throw new SDBError('CANVAS SDB 서명이 아닙니다: ' + JSON.stringify(sig));
    if (this.d[0x14] !== 1) throw new SDBError('Jet4 형식이 아닙니다 (version byte ' + this.d[0x14] + ').');
    this.signature = sig;
    this.npages = this.d.length / PS;
    this._loadTables();
  }
  // primitive access
  u8(o) { return this.d[o]; }
  u16(o) { return this.d[o] | this.d[o + 1] << 8; }
  u32(o) { return (this.d[o] | this.d[o + 1] << 8 | this.d[o + 2] << 16 | this.d[o + 3] << 24) >>> 0; }
  i32(o) { return this.d[o] | this.d[o + 1] << 8 | this.d[o + 2] << 16 | this.d[o + 3] << 24; }
  w16(o, v) { this.d[o] = v & 0xFF; this.d[o + 1] = (v >> 8) & 0xFF; }
  w32(o, v) { this.d[o] = v & 0xFF; this.d[o + 1] = (v >>> 8) & 0xFF; this.d[o + 2] = (v >>> 16) & 0xFF; this.d[o + 3] = (v >>> 24) & 0xFF; }
  page(pg) { return this.d.subarray(pg * PS, (pg + 1) * PS); }

  // ── table definitions ──────────────────────────────────────────────────────
  _tdefBuffer(pg) {
    const parts = [this.page(pg)]; let nxt = this.u32(pg * PS + 4), guard = 0;
    while (nxt && guard++ < 64) { parts.push(this.page(nxt).subarray(8)); nxt = this.u32(nxt * PS + 4); }
    return concat(parts);
  }
  _loadTables() {
    const conts = new Set(), defs = [];
    for (let pg = 0; pg < this.npages; pg++) {
      const o = pg * PS;
      if (this.d[o] !== 0x02 || this.d[o + 1] !== 0x01) continue;
      const nxt = this.u32(o + 4); if (nxt) conts.add(nxt);
      defs.push(pg);
    }
    this.tables = [];
    for (const pg of defs) {
      if (conts.has(pg)) continue;
      try { this.tables.push(this._parseTdef(pg)); } catch (e) { /* not a user table def */ }
    }
    const find = cols => this.tables.find(t => cols.every(c => t.colByName[c]));
    this.track = find(['strTranslation', 'iInFrame', 'iOutFrame', 'iID']);
    this.format = find(['iSubtitleID', 'iFormat', 'iFrom', 'iTo']);
    if (!this.track) throw new SDBError('Track 테이블을 찾지 못했습니다.');
    // data pages per table
    const owned = new Map(this.tables.map(t => [t.page, []]));
    for (let pg = 0; pg < this.npages; pg++) {
      const o = pg * PS;
      if (this.d[o] === 0x01 && this.d[o + 1] === 0x01 && owned.has(this.u32(o + 4))) owned.get(this.u32(o + 4)).push(pg);
    }
    for (const t of this.tables) t.dataPages = owned.get(t.page);
  }
  _parseTdef(pg) {
    const b = this._tdefBuffer(pg);
    const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
    const t = { page: pg, rows: dv.getUint32(16, true), nvar: dv.getUint16(43, true), ncols: dv.getUint16(45, true),
      nidx: dv.getInt32(47, true), nridx: dv.getInt32(51, true) };
    if (t.ncols === 0 || t.ncols > 255 || t.nridx < 0 || t.nridx > 64) throw new Error('bad tdef');
    let pos = 63 + t.nridx * 12, npos = pos + t.ncols * 25;
    t.cols = [];
    for (let i = 0; i < t.ncols; i++) {
      const c = b.subarray(pos, pos + 25);
      const ln = dv.getUint16(npos, true); npos += 2;

// 4바이트 묶음값. 0 = 전역 설정(Globals) 그대로. 최상위 바이트 2 = 縦書き, 1 = 横書き.

// ── VIEW ─────────────────────────────────────────────────────────────────────

}

  if (a < 0 || b < 0 || b < a) { notify('타임코드가 잘못되었습니다 (HH:MM:SS:FF)', 'err'); return; }
  const e = state.entries[idx], text = et.value.replace(/\r\n/g, '\n');
  if (a === e.inFrame && b === e.outFrame && text === e.text) delete state.modified[idx];
  else state.modified[idx] = { inFrame: a, outFrame: b, text };
  renderTable(); renderEditPanel(); scrollToSel(); notify('적용!');
}
function revertEdit() { const i = state.selected; if (i < 0) return; delete state.modified[i]; renderTable(); renderEditPanel(); notify('원복!'); }
function blankEntry() { const i = state.selected; if (i < 0) return; state.blanked.add(i); state.deleted.delete(i); delete state.modified[i]; renderTable(); renderEditPanel(); scrollToSel(); notify('비움 처리!', 'warn'); }
function deleteEntry() { const i = state.selected; if (i < 0) return; state.deleted.add(i); state.blanked.delete(i); delete state.modified[i]; renderTable(); renderEditPanel(); scrollToSel(); notify('삭제 예정!', 'warn'); }
function restoreEntry() { const i = state.selected; if (i < 0) return; state.deleted.delete(i); state.blanked.delete(i); renderTable(); renderEditPanel(); scrollToSel(); notify('복원!'); }

function selectAll() { filtered().forEach(({ i }) => state.selectedSet.add(i)); renderTable(); updateToolbarButtons(); }
function selectNone() { state.selectedSet.clear(); const c = document.getElementById('chk-all'); if (c) c.checked = false; renderTable(); updateToolbarButtons(); }
function deleteSelected() {
  const sel = [...state.selectedSet]; if (!sel.length) return;
  if (!confirm(`선택한 ${sel.length}개 항목을 삭제할까요?`)) return;
  sel.forEach(i => { state.deleted.add(i); state.blanked.delete(i); delete state.modified[i]; });
  state.selectedSet.clear(); renderTable(); renderEditPanel(); updateToolbarButtons(); notify(`${sel.length}개 삭제 예정`, 'warn');
}
function keepSelected() {
  const sel = new Set(state.selectedSet); if (!sel.size) return;
  const toDel = state.entries.map((_, i) => i).filter(i => !sel.has(i) && !state.deleted.has(i));
  if (!confirm(`선택한 ${sel.size}개만 남기고 나머지 ${toDel.length}개를 삭제할까요?`)) return;
  toDel.forEach(i => { state.deleted.add(i); state.blanked.delete(i); delete state.modified[i]; });
  state.selectedSet.clear(); renderTable(); renderEditPanel(); updateToolbarButtons(); notify(`${toDel.length}개 삭제, ${sel.size}개 유지`, 'warn');
}
function restoreAll() {
  if (!confirm('모든 수정/삭제/비움을 취소하고 원래 상태로 되돌릴까요?')) return;
  state.deleted.clear(); state.blanked.clear(); state.modified = {}; state.selectedSet.clear();
  renderTable(); renderEditPanel(); updateToolbarButtons(); notify('전체 복원 완료!');
}
function updateToolbarButtons() {
  const hasSel = state.selectedSet.size > 0, has = state.entries.length > 0;
  document.getElementById('btn-del-selected').disabled = !hasSel;
  document.getElementById('btn-keep-selected').disabled = !hasSel;
  document.getElementById('btn-sel-all').disabled = !has;
  document.getElementById('btn-sel-none').disabled = !hasSel;
  document.getElementById('btn-restore-all').disabled = !has;
}
function updateStats() {
  const mc = Object.keys(state.modified).length, bc = state.blanked.size, dc = state.deleted.size;
  document.getElementById('stat-total').textContent = state.entries.length;
  document.getElementById('stat-mod').textContent = mc;
  document.getElementById('stat-blank').textContent = bc;
  document.getElementById('stat-del').textContent = dc;
  document.getElementById('stat-ital').textContent = state.entries.filter(e => e.italic).length;
  document.getElementById('stat-vert').textContent = state.entries.filter(e => e.orient.vertical).length;
  document.getElementById('stat-ruby').textContent = state.entries.reduce((n, e) => n + e.rubies.length, 0);
  const g = state.globals; document.getElementById('stat-font').textContent = g ? `${g.strGlobFontName} · ${g.iGlobFontSize}` : '-';
  const sc = state.selectedSet.size;
  document.getElementById('stat-sel').textContent = sc ? `${sc}개 체크` : (state.selected >= 0 ? '番号 ' + state.entries[state.selected]?.num : '-');
  document.getElementById('stat-size').textContent = state.rawData ? (state.rawData.byteLength / 1024).toFixed(1) + ' KB' : '-';
  document.getElementById('mod-label').textContent = mc + bc + dc ? `✏️ ${mc}수정 ⬜${bc}비움 🗑${dc}삭제` : '';
}
function selectEntry(i) { state.selected = i; renderTable(); renderEditPanel(); updateStats(); }
function navigate(dir) {
  const list = filtered().map(f => f.i); if (!list.length) return;
  let cur = list.indexOf(state.selected); cur = cur < 0 ? 0 : Math.max(0, Math.min(list.length - 1, cur + dir));
  selectEntry(list[cur]); scrollToSel();
}
function scrollToSel() { const r = document.querySelector('tr.selected'); if (r) r.scrollIntoView({ block: 'nearest' }); }
function notify(msg, type = 'ok') {
  const el = document.createElement('div'); el.className = 'notif' + (type === 'err' ? ' err' : type === 'warn' ? ' warn' : '');
  el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), type === 'err' ? 5000 : 2200);
}
function modal(title, html, buttons) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><h3>${title}</h3><div class="mbody">${html}</div><div class="mfoot"></div></div>`;
  const foot = bg.querySelector('.mfoot');
  buttons.forEach(([label, cls, fn]) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = label; b.onclick = () => { bg.remove(); fn && fn(); }; foot.appendChild(b); });
  document.body.appendChild(bg);
}

// ── 폰트·서식 설정 (Globals) ──────────────────────────────────────────────
function colorCell(v) {
  if (v === null || v === undefined) return '-';
  const u = v >>> 0, r = u & 0xFF, g = (u >> 8) & 0xFF, b = (u >> 16) & 0xFF;   // Windows COLORREF (0x00BBGGRR)
  const hex = '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
  return `<span class="swatch" style="background:${hex}"></span>${hex}`;
}
function showGlobals() {
  const g = state.globals; if (!g) return;
  const fps = { 5: '23.976 (추정)' }[g.iFrameType] || g.iFrameType;
  const orient = (g.iGlobOrientation >>> 0) >>> 24 === 2 ? '縦書き' : '横書き';
  const rows = [
    ['자막 폰트'],
    ['폰트', esc(g.strGlobFontName)], ['크기', g.iGlobFontSize], ['장평(폭)', g.iGlobFontWidth === 0 ? '0 (기본)' : g.iGlobFontWidth],
    ['글자색', colorCell(g.iGlobFontColor)], ['테두리', `종류 ${g.iGlobEdgeType} · 두께 ${g.iGlobEdgeSize}`], ['테두리색', colorCell(g.iGlobEdgeColor)],
    ['이탤릭 각도', g.iItalicAngle === 0 ? '0 (기본)' : g.iItalicAngle],
    ['자간 / 행간'],
    ['가로쓰기 자간 · 행간', `${g.iGlobHorizKerning} · ${g.iGlobHorizLeading}`], ['세로쓰기 자간 · 행간', `${g.iGlobVertKerning} · ${g.iGlobVertLeading}`],
    ['반각 공백', g.bHalfSpaces ? '예' : '아니오'],
    ['루비'],
    ['루비 폰트', esc(g.strGlobRubiFontName)], ['루비 크기', g.iGlobRubiFontSize], ['루비 테두리', g.iGlobRubiEdgeSize],
    ['루비 위치 값', g.iGlobRubiPosition], ['이탤릭 연동', g.iGlobRubiItalicSync ? '예' : '아니오'], ['루비 행간 · 傍点 행간', `${g.iRubyLeading} · ${g.iDotLeading}`],
    ['화면 / 배치'],
    ['기본 방향', `${orient} (0x${(g.iGlobOrientation >>> 0).toString(16).padStart(8, '0')})`],
    ['여백 (좌·상·우·하)', `${g.rcGlobTitleMarginLeft} · ${g.rcGlobTitleMarginTop} · ${g.rcGlobTitleMarginRight} · ${g.rcGlobTitleMarginBottom}`],
    ['소스 해상도', `${g.iSourceWidth} × ${g.iSourceHeight}`], ['레터박스 · 16:9 풀스크린', `${g.iGlobLetterBoxed} · ${g.iGlobFullScreen16by9}`],
    ['하단 정렬', g.iGlobBottomAlign], ['RTL · 세로 LTR', `${g.bRTL ? '예' : '아니오'} · ${g.bVertLTR ? '예' : '아니오'}`],
    ['타임코드 / 효과'],
    ['프레임 타입', fps], ['드롭프레임', g.bDropFrame ? '예' : '아니오 (NDF)'],
    ['In 효과 · 시간', `${g.iInEffect} · ${g.iInEffectTime}`], ['Out 효과 · 시간', `${g.iOutEffect} · ${g.iOutEffectTime}`],
    ['마스크', g.bMaskOn ? '켜짐 ' + colorCell(g.clrMaskColor) : '꺼짐'],
    ['금칙 / 기타'],
    ['행두 금칙 문자', `<code>${esc(g.strCharacters || '')}</code>`], ['반각 처리 문자', `<code>${esc(g.strSingleCharacters || '')}</code>`],
    ['프리셋 이름', esc(g.strGlobPresetName || '(없음)')], ['출력 · 마스터 테이프 값', `${g.iOutputTape} · ${g.iMasterTape}`],
  ];
  const html = `<table class="kv">${rows.map(r => r.length === 1 ? `<tr class="sec"><td colspan="2">${r[0]}</td></tr>` : `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
    <p class="hint" style="margin-top:10px">파일 전체에 적용되는 기본 설정입니다. 4개 작품 모두 자막별 폰트 지정은 없었습니다. 에디터는 이 값을 읽어 보여 주기만 하고 바꾸지 않습니다.</p>`;
  modal('🅵 폰트·서식 설정 — ' + esc(state.filename), html, [['닫기', 'btn-secondary']]);
}

// ── SAVE ─────────────────────────────────────────────────────────────────────
function collectChanges() {
  const ch = [];
  state.entries.forEach((e, i) => {
    if (state.deleted.has(i)) ch.push({ iID: e.iID, delete: true });
    else if (state.blanked.has(i)) ch.push({ iID: e.iID, text: '' });
    else if (state.modified[i]) { const m = state.modified[i]; ch.push({ iID: e.iID, text: m.text, inFrame: m.inFrame, outFrame: m.outFrame }); }
  });
  return ch;
}
// Build edited file, then re-open it and check structure + every intended value
function buildAndVerify() {
  const changes = collectChanges();
  const db = new SDB(new Uint8Array(state.rawData));
  const report = db.applyChanges(changes);
  const out = db.bytes();
  const problems = [];
  let check;
  try { check = new SDB(out); problems.push(...check.verify()); }
  catch (err) { problems.push('저장본을 다시 열 수 없음: ' + err.message); }
  if (check) {
    const got = new Map(check.readSubtitles().map(s => [s.iID, s]));
    state.entries.forEach((e, i) => {
      const g = got.get(e.iID);
      if (state.deleted.has(i)) { if (g) problems.push(`番号 ${e.num}: 삭제되지 않음`); return; }
      if (!g) { problems.push(`番号 ${e.num}: 행이 사라짐`); return; }
      const eff = state.blanked.has(i) ? { ...getEff(i), text: '' } : getEff(i);
      if (g.inFrame !== eff.inFrame || g.outFrame !== eff.outFrame || g.text.replace(/\r\n/g, '\n') !== eff.text) problems.push(`番号 ${e.num}: 값 불일치`);
    });
    if (got.size !== state.entries.length - state.deleted.size) problems.push(`행 수 불일치 (${got.size})`);
  }
  return { out, report, problems, changes };
}
function saveSDB() {
  let res;
  try { res = buildAndVerify(); }
  catch (err) { console.error(err); modal('저장 실패', `<p class="bad">${esc(err instanceof SDBError ? err.message : '내부 오류: ' + err.message)}</p><p>원본은 변경되지 않았습니다.</p>`, [['닫기', 'btn-secondary']]); return; }
  const { out, report, problems, changes } = res;
  const fname = state.filename.replace(/\.sdb$/i, '') + '_edited.sdb';
  const lines = [
    `<li>수정 ${report.updated}행 · 삭제 ${report.deleted}행</li>`,
    `<li>서식(이탤릭/루비) 범위 조정 ${report.formatsAdjusted}건 · 서식 행 삭제 ${report.formatsDeleted}건</li>`,
    `<li>파일 크기 ${(state.rawData.byteLength / 1024).toFixed(0)} KB → ${(out.length / 1024).toFixed(0)} KB (4096바이트 페이지 단위 ${out.length % 4096 === 0 ? '✔' : '✘'})</li>`
  ];
  const warn = report.warnings.length ? `<p class="warnc" style="margin-top:8px">확인 필요 ${report.warnings.length}건</p><ul>${report.warnings.slice(0, 30).map(w => `<li class="warnc">${esc(w)}</li>`).join('')}</ul>` : '';
  if (problems.length) {
    modal('⚠ 검증 실패 — 저장하지 않았습니다', `<ul>${lines.join('')}</ul><p class="bad" style="margin-top:8px">구조 검사에서 문제가 발견되었습니다:</p><ul>${problems.slice(0, 30).map(p => `<li class="bad">${esc(p)}</li>`).join('')}</ul><p style="margin-top:8px">이 화면을 캡처해 공유해 주세요.</p>`, [['닫기', 'btn-secondary']]);
    return;
  }
  if (!changes.length) { notify('변경 사항이 없습니다', 'warn'); return; }
  modal('저장 전 검증 통과 ✔', `<ul>${lines.join('')}<li class="ok">행 수 · 인덱스 3종 · 모든 자막 값 재확인 완료</li></ul>${warn}<p style="margin-top:8px">파일명: <b>${esc(fname)}</b></p>`,
    [['취소', 'btn-secondary'], ['💾 다운로드', 'btn-success', () => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], { type: 'application/octet-stream' }));
      a.download = fname; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); notify('SDB 저장 완료!');
    }]]);
}
function exportSRT() {
  const o = offsets();
  const items = state.entries.map((e, i) => ({ e, i })).filter(({ i }) => !state.deleted.has(i) && !state.blanked.has(i))
    .map(({ i }) => getEff(i)).filter(x => x.text.trim()).sort((a, b) => a.inFrame - b.inFrame);
  const body = items.map((x, n) => `${n + 1}\n${srtTime(x.inFrame + o.in)} --> ${srtTime(x.outFrame + o.out)}\n${x.text}\n`).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + body], { type: 'text/plain;charset=utf-8' }));
  a.download = state.filename.replace(/\.sdb$/i, '') + '.srt'; a.click(); notify('SRT 내보내기 완료!');
}

// ── EVENTS ────────────────────────────────────────────────────────────────────
document.getElementById('btn-open').onclick = () => document.getElementById('file-input').click();
document.getElementById('file-input').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ''; };
document.getElementById('btn-save').onclick = saveSDB;
document.getElementById('btn-globals').onclick = showGlobals;
document.getElementById('font-chip').onclick = showGlobals;
document.getElementById('btn-export-srt').onclick = exportSRT;
document.getElementById('btn-prev').onclick = () => navigate(-1);
document.getElementById('btn-next').onclick = () => navigate(1);
document.getElementById('btn-del-selected').onclick = deleteSelected;
document.getElementById('btn-keep-selected').onclick = keepSelected;
document.getElementById('btn-sel-all').onclick = selectAll;
document.getElementById('btn-sel-none').onclick = selectNone;
document.getElementById('btn-restore-all').onclick = restoreAll;
document.getElementById('fps-select').onchange = () => { renderTable(); renderEditPanel(); };
document.getElementById('tc-mode').onchange = () => { renderTable(); renderEditPanel(); };
document.getElementById('search-input').oninput = e => { state.searchTerm = e.target.value; renderTable(); };
document.getElementById('view-filter').onchange = e => { state.viewFilter = e.target.value; renderTable(); };
document.body.addEventListener('dragover', e => { e.preventDefault(); document.getElementById('drop-zone')?.classList.add('drag-over'); });
document.body.addEventListener('dragleave', () => document.getElementById('drop-zone')?.classList.remove('drag-over'));
document.body.addEventListener('drop', e => {
  e.preventDefault(); document.getElementById('drop-zone')?.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (!f) return;
  if (!f.name.toLowerCase().endsWith('.sdb')) { notify('SDB 파일만 지원됩니다', 'err'); return; }
  if (Object.keys(state.modified).length + state.deleted.size + state.blanked.size && !confirm('저장하지 않은 변경 사항이 있습니다. 새 파일을 열까요?')) return;
  loadFile(f);
});
window.addEventListener('beforeunload', e => { if (Object.keys(state.modified).length + state.deleted.size + state.blanked.size) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('keydown', e => {
  if (document.querySelector('.modal-bg')) return;
  const tag = document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'Enter')) { e.preventDefault(); applyEdit(); }
    if (e.key === 'Escape') document.activeElement.blur();
    return;
  }
  if (!state.entries.length) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); navigate(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); navigate(-1); }
  if (e.key === 'Delete' && state.selected >= 0) deleteEntry();
  if (e.key === 'Backspace' && state.selected >= 0) { e.preventDefault(); blankEntry(); }
  if (e.key === 'Enter' && state.selected >= 0) { const ta = document.getElementById('et'); if (ta) ta.focus(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveSDB(); }
});
</script>
